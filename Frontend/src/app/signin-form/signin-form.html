<div class="login-container">
  <div class="logo">Login</div>

  <form 
  #loginForm="ngForm" 
  (ngSubmit)="onSubmit()"
  >
    <div class="input-group email">
      <label for="email">Email Address</label>

      <input type="email" id="email" placeholder="student@example.com" name="email" ngModel 
      #emailRef="ngModel"
      required
      email
      />
      @if (emailRef.invalid && emailRef.touched) {
        <div class="error-message">*Valid email is required</div>
      }
    </div>

    <div class="input-group password">
      <label for="password">Password</label>

      <input type="password" id="password" placeholder="••••••••"  name="password" ngModel
      #passwordRef="ngModel"
      required
      />
       @if (passwordRef.invalid && passwordRef.touched) {
        <div class="error-message">*Password is required</div>
      }
      
    </div>

    @if (errorMessage()) {
      <div class="error-message">
        *{{errorMessage()}}
      </div>
    }

    <button type="submit" class="login-button">Log In</button>
  </form>

  <p class="signup-link">
    Don't have an account?
    <a href="#">Sign Up Free</a>
  </p>
</div>
